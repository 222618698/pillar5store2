spring:
  datasource:
    url: jdbc:mysql://localhost:3306/p5store?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update          # use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:p5storeSecretKeyChangeInProductionMustBe256BitsLong}
    expiration-ms: 86400000        # 24 hours
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    com.p5store: DEBUG
    org.springframework.security: WARN
